version: '3.8'

services:
  page-search-api:
    build:
      context: .
      dockerfile: page-search-api/Dockerfile
    container_name: page-search-api
    network_mode: host
    environment:
      NUTCHWAX_SEARCH_FILE: /app/
      # Spring relaxed-binding form of searchpages.textsearch.service.bean.solr.link
      # (a plain SOLR_URL var does *not* bind to this property, so it must be spelled
      # out exactly like this to actually override it).
      SEARCHPAGES_TEXTSEARCH_SERVICE_BEAN_SOLR_LINK: http://p44.arquivo.pt:2200/solr/pages
      SERVER_PORT: 8080
      # Matches the Dockerfile's default JAVA_OPTS (this fully replaces it,
      # not merges) — see DOCKER_DEPLOYMENT.md for the flag rationale and
      # why production deployments need an explicit memory limit for these
      # percentage-based flags to size the heap correctly (this dev compose
      # file intentionally has none, so they size off the host's memory).
      JAVA_OPTS: -XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError
    restart: unless-stopped
    # Shallow TCP liveness check: confirms the JVM/Tomcat is accepting
    # connections without exercising business logic or Solr. A deep check
    # (e.g. hitting /textsearch) risks cascading restarts if Solr is merely
    # slow rather than broken. Override in an environment-specific compose
    # file if a deployment needs different semantics.
    healthcheck:
      test: ["CMD-SHELL", "cat < /dev/null > /dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
