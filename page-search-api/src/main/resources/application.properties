server.port = 8081
server.error.whitelabel.enabled=false

searchpages.api.servicename = Arquivo.pt - the Portuguese web-archive
searchpages.api.startdate =  19960101000000
searchpages.api.globaltimeout.ms = 60000
searchpages.api.show.ids = true
# How long the volumes of the archive per year are reused, by the timeline and by the year balance ranking (24h)
searchpages.api.yearvolumes.ttl.ms = 86400000

searchpages.service.link = http://localhost:8081
searchpages.textsearch.service.link = http://localhost:8081/textsearch
searchpages.extractedtext.service.link = http://localhost:8081/textextracted
# possible values: solr or nutchwax
# searchpages.textsearch.service.bean = nutchwax
searchpages.textsearch.service.bean = fusion
searchpages.textsearch.service.bean.solr.link = http://p44.arquivo.pt:2200/solr/pages
searchpages.textsearch.service.bean.fusion.nutchwax.textsearch.api.link = https://dev.arquivo.pt/textsearchnutchwax
# Max time (ms) Solr is allowed to spend processing a single query (timeAllowed param), to protect it from slow queries
searchpages.solr.timeallowed.ms = 10000
# Timeout (ms) for the CDX lookup queryByUrl uses to resolve a document's collection before falling back to a
# regex search; kept short since it's a fast-path optimization, not the only way to find the document
searchpages.queryByUrl.cdx.timeout.ms = 1000
# Regex matching every "numbered" collection code (e.g. AWP12, FAWP3, PATCHING2019, RAQ2021), used as part of the
# queryByUrl regex fallback. Widen the digit bound here once a collection (e.g. FAWP) reaches triple digits, or
# add a new "|"-separated alternative here for a wholly new numbered pattern.
searchpages.queryByUrl.numberedCollectionsRegex = [EFMS]?AWP[1-9][0-9]?|PATCHING20[1-9][0-9]|RAQ20[1-9][0-9]
# Collection codes that don't follow the "<prefix>AWP<N>" pattern, named individually instead - comma separated.
# Add a new collection here when it falls outside that pattern (e.g. Roteiro, Dinis).
searchpages.queryByUrl.namedCollections = BN,BlocoEsquerda,BlogsSapo2018,CEGER,Curadoria,DEM-IST,Dinis,DinisAlves2018,EAWP10-2,Geocities,IA,InternetMemory,NON,Revisionista,Roteiro,Tomba,UL,Weblog
# Timeouts for the /textsearch/healthcheck ping to Solr, kept short so a hanging Solr fails the check
# quickly instead of blocking whatever deploy gate is polling it
searchpages.healthcheck.solr.connectiontimeout.ms = 2000
searchpages.healthcheck.solr.sockettimeout.ms = 3000

wayback.service.endpoint = https://dev.arquivo.pt/wayback
wayback.noframe.service.endpoint = https://dev.arquivo.pt/noFrame/replay
wayback.service.cdx.endpoint = https://dev.arquivo.pt/wayback/cdx
wayback.service.cdx.timeout = 3000

screenshot.service.endpoint = https://dev.arquivo.pt/screenshot

springdoc.api-docs.path = /textsearch/api-docs/v3
springdoc.swagger-ui.path = /textsearch/api-docs


